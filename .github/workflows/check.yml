name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Regenerate the FRB bindings and fail if they are not committed in sync.
  # Catches the classic "edited generated files / stale codegen" drift.
  frb-codegen-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        # Pinned to the Flutter used to generate the FRB bindings locally — the
        # codegen's `dart format` import grouping differs across Dart versions,
        # and the diff gate must compare against the same formatter.
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install flutter_rust_bridge_codegen 2.12.0
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libevdev-dev libudev-dev libxi-dev libxtst-dev libayatana-appindicator3-dev

      - name: Regenerate FRB bindings
        working-directory: flutter
        run: flutter_rust_bridge_codegen generate

      - name: Verify generated files are in sync
        run: git diff --exit-code

  # Three-platform quality matrix for the new Flutter + Rust core stack.
  quality:
    needs: frb-codegen-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        # Pinned to the Flutter used to generate the FRB bindings locally — the
        # codegen's `dart format` import grouping differs across Dart versions,
        # and the diff gate must compare against the same formatter.
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: 'flutter/rust -> target'

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libevdev-dev libudev-dev libxi-dev libxtst-dev libayatana-appindicator3-dev

      - name: flutter analyze
        working-directory: flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub

      - name: flutter test
        working-directory: flutter
        run: flutter test --no-pub

      - name: cargo fmt
        working-directory: flutter/rust
        run: cargo fmt -- --check

      - name: cargo clippy
        working-directory: flutter/rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: flutter/rust
        run: cargo test --locked

      - name: cargo audit
        if: runner.os == 'Linux'
        working-directory: flutter/rust
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings

      - name: Build evdev helper (Linux only)
        if: runner.os == 'Linux'
        working-directory: rust/evdev-helper
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
