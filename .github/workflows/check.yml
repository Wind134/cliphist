name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Regenerate the FRB bindings and fail if they are not committed in sync.
  # Catches the classic "edited generated files / stale codegen" drift.
  frb-codegen-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        # Pinned to the Flutter used to generate the FRB bindings locally — the
        # codegen's `dart format` import grouping differs across Dart versions,
        # and the diff gate must compare against the same formatter.
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install flutter_rust_bridge_codegen 2.12.0
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libevdev-dev libudev-dev libxi-dev libxtst-dev

      - name: Regenerate FRB bindings
        working-directory: flutter
        run: flutter_rust_bridge_codegen generate

      - name: Verify generated files are in sync
        run: git diff --exit-code

  # Three-platform quality matrix for the new Flutter + Rust core stack.
  quality:
    needs: frb-codegen-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        # Pinned to the Flutter used to generate the FRB bindings locally — the
        # codegen's `dart format` import grouping differs across Dart versions,
        # and the diff gate must compare against the same formatter.
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'flutter/rust -> target'

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libevdev-dev libudev-dev libxi-dev libxtst-dev

      - name: flutter analyze
        working-directory: flutter
        run: flutter analyze

      - name: cargo fmt
        working-directory: flutter/rust
        run: cargo fmt -- --check

      - name: cargo clippy
        working-directory: flutter/rust
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: flutter/rust
        run: cargo test

      - name: Build evdev helper (Linux only)
        if: runner.os == 'Linux'
        working-directory: rust/evdev-helper
        run: cargo build --locked