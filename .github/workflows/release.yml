name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Block the build matrix until the generated FRB bindings are in sync.
  frb-codegen-check:
    # A release commit creates its tag only after every build succeeds. Manual
    # tag pushes remain supported for recovery or an intentionally rebuilt tag.
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        # Pinned to the Flutter version used to generate + validate the FRB
        # bindings locally. The codegen runs `dart format` on its output, and
        # import grouping drifted between Dart SDK versions — the frb-codegen-check
        # diff gate must compare against the same formatter.
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install flutter_rust_bridge_codegen 2.12.0
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libevdev-dev libudev-dev libxi-dev libxtst-dev libayatana-appindicator3-dev
      - name: Regenerate FRB bindings
        working-directory: flutter
        run: flutter_rust_bridge_codegen generate
      - name: Verify generated files are in sync
        run: git diff --exit-code

  # A release tag must pass the same three-platform quality gate as a PR.
  quality:
    needs: frb-codegen-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: 'flutter/rust -> target'
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libevdev-dev libudev-dev libxi-dev libxtst-dev libayatana-appindicator3-dev
      - name: Flutter quality
        working-directory: flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Rust quality
        working-directory: flutter/rust
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Rust dependency audit
        if: runner.os == 'Linux'
        working-directory: flutter/rust
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
      - name: Linux helper quality
        if: runner.os == 'Linux'
        working-directory: rust/evdev-helper
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  build-linux:
    needs: [frb-codegen-check, quality]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        # Pinned to the Flutter version used to generate + validate the FRB
        # bindings locally. The codegen runs `dart format` on its output, and
        # import grouping drifted between Dart SDK versions — the frb-codegen-check
        # diff gate must compare against the same formatter.
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: 'flutter/rust -> target'
          shared-key: linux

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libevdev-dev libudev-dev libxi-dev libxtst-dev libayatana-appindicator3-dev libkeybinder-3.0-dev librsvg2-dev desktop-file-utils

      - name: Set version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(grep '^version:' flutter/pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          fi
          test -n "$VERSION"
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" flutter/pubspec.yaml

      - name: Build evdev helper (release)
        working-directory: rust/evdev-helper
        run: cargo build --release --locked

      - name: Install fastforge
        run: dart pub global activate fastforge 0.6.12

      # The appimage maker invokes `appimagetool` from PATH (no auto-download).
      # GitHub runners have no FUSE, so extract the AppImage and use the inner
      # binary directly. appimagetool shells out to `mksquashfs`, which it
      # locates at <bindir>/../lib/appimagekit/mksquashfs — so copy the binary
      # to /usr/local/bin and the appimagekit/ subdir to /usr/local/lib/.
      # Copying the whole extracted usr/ tree is wrong: it also dumps the
      # AppImage's bundled libstdc++/libgcc_s into /usr/local/lib (a standard
      # linker path), which the `flutter build linux` link then picks up and
      # fails with "clang: error: linker command failed with exit code 1".
      - name: Install appimagetool
        run: |
          cd /tmp
          APPIMAGETOOL_SHA256=b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output appimagetool.AppImage
          echo "$APPIMAGETOOL_SHA256  appimagetool.AppImage" | sha256sum --check --strict
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null
          sudo cp squashfs-root/usr/bin/appimagetool /usr/local/bin/
          sudo mkdir -p /usr/local/lib/appimagekit
          sudo cp squashfs-root/usr/lib/appimagekit/* /usr/local/lib/appimagekit/
          test -x /usr/local/bin/appimagetool && test -x /usr/local/lib/appimagekit/mksquashfs

      # --hook-pre runs after `flutter build` and before the makers, so the
      # privileged helper + polkit policy get packed into the bundle (they land
      # in /opt/cliphist/ of the deb; the deb postinstall moves the policy to
      # /usr/share/polkit-1/actions/). The AppImage ignores them (see
      # linux/packaging/appimage/make_config.yaml).
      - name: Build Linux packages
        working-directory: flutter
        run: |
          dart pub global run fastforge:main package --platform linux --targets deb,appimage \
            --artifact-name '{{name}}-{{build_name}}-linux.{{ext}}' \
            --hook-pre 'cp ../rust/evdev-helper/target/release/cliphist-evdev-helper build/linux/x64/release/bundle/ && cp assets/polkit/com.ping.cliphist.policy build/linux/x64/release/bundle/'
      - name: Upload deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cliphist-linux-amd64-deb
          path: flutter/dist/**/*.deb
          retention-days: 5
      - name: Upload AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cliphist-linux-amd64-appimage
          path: flutter/dist/**/*.AppImage
          retention-days: 5

  build-windows:
    needs: [frb-codegen-check, quality]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        # Pinned to the Flutter version used to generate + validate the FRB
        # bindings locally. The codegen runs `dart format` on its output, and
        # import grouping drifted between Dart SDK versions — the frb-codegen-check
        # diff gate must compare against the same formatter.
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: 'flutter/rust -> target'
          shared-key: windows
      - name: Set version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(grep '^version:' flutter/pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          fi
          test -n "$VERSION"
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" flutter/pubspec.yaml
          sed -i "s/^  msix_version: .*/  msix_version: $VERSION.${{ github.run_number }}/" flutter/pubspec.yaml
          sed -i "s/^msix_version: .*/msix_version: $VERSION.${{ github.run_number }}/" flutter/windows/packaging/msix/make_config.yaml
      - name: Install fastforge
        run: dart pub global activate fastforge 0.6.12
      # The exe maker needs Inno Setup 6 (ISCC.exe) — it does not auto-install.
      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
      # Diagnostic: build the Rust cdylib directly so any cargo compile/link
      # error is streamed to this log. Cargokit (invoked by `flutter build
      # windows` below) runs cargo via Process.runSync, which captures
      # stdout/stderr and only re-emits it on failure via a Dart log.severe —
      # but MSBuild's VS-generator custom-build step redirects that to a
      # build log the runner never surfaces, so a Cargokit cargo failure shows
      # only as a context-free MSB8066 "exited with code -1". Building here
      # with the host target (x86_64-pc-windows-msvc, same as Cargokit's
      # windows-x64) reproduces the compile faithfully; cargo writes errors to
      # stderr which Actions captures. If this step is green but the fastforge
      # step still fails, the problem is Cargokit plumbing, not the Rust code.
      - name: Build Rust library (surfaces cargo errors Cargokit hides)
        working-directory: flutter/rust
        run: cargo build --release --locked
      - name: Build Windows packages
        working-directory: flutter
        run: |
          dart pub global run fastforge:main package --platform windows --targets exe,msix
      - name: Upload NSIS setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cliphist-windows-x64-setup
          path: flutter/dist/**/*.exe
          retention-days: 5
      - name: Upload MSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cliphist-windows-x64-msix
          path: flutter/dist/**/*.msix
          retention-days: 5

  build-macos:
    needs: [frb-codegen-check, quality]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        # Pinned to the Flutter version used to generate + validate the FRB
        # bindings locally. The codegen runs `dart format` on its output, and
        # import grouping drifted between Dart SDK versions — the frb-codegen-check
        # diff gate must compare against the same formatter.
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: 'flutter/rust -> target'
          shared-key: macos
      - name: Set version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(grep '^version:' flutter/pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          fi
          test -n "$VERSION"
          sed -i '' 's/^version: .*/version: '"$VERSION"'+${{ github.run_number }}/' flutter/pubspec.yaml
      - name: Install fastforge
        run: dart pub global activate fastforge 0.6.12
      # The dmg maker requires `appdmg` and auto-installs it via `pnpm`, which
      # is not on the macos runner — pre-install with npm so the requirement
      # check passes.
      - name: Install appdmg
        run: npm install -g appdmg@0.6.6
      # Native arch only (macos-latest = arm64). An x86_64 dmg would need a
      # full x64 cross toolchain (Rust + Flutter) — tracked as a follow-up.
      - name: Build macOS dmg
        working-directory: flutter
        run: |
          dart pub global run fastforge:main package --platform macos --targets dmg
      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cliphist-macos-arm64
          path: flutter/dist/**/*.dmg
          retention-days: 5

  checksums:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f -not -name '*.sha256' -exec sha256sum {} \; | sort > checksums.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checksums
          path: artifacts/checksums.sha256
          retention-days: 5

  release:
    needs: [build-linux, build-windows, build-macos, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Generate release notes
        run: |
          git log --oneline --no-decorate $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD > changelog.txt
      - name: Resolve release tag
        id: release-meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME=$GITHUB_REF_NAME
          else
            VERSION=$(grep '^version:' flutter/pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
            TAG_NAME=v$VERSION
          fi
          test -n "$TAG_NAME"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
      - name: Create Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ steps.release-meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
          body_path: changelog.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
