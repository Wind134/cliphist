name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Block the build matrix until the generated FRB bindings are in sync.
  frb-codegen-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        # Pinned to the Flutter version used to generate + validate the FRB
        # bindings locally. The codegen runs `dart format` on its output, and
        # import grouping drifted between Dart SDK versions — the frb-codegen-check
        # diff gate must compare against the same formatter.
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install flutter_rust_bridge_codegen 2.12.0
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libevdev-dev libudev-dev libxi-dev libxtst-dev libayatana-appindicator3-dev
      - name: Regenerate FRB bindings
        working-directory: flutter
        run: flutter_rust_bridge_codegen generate
      - name: Verify generated files are in sync
        run: git diff --exit-code

  build-linux:
    needs: frb-codegen-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        # Pinned to the Flutter version used to generate + validate the FRB
        # bindings locally. The codegen runs `dart format` on its output, and
        # import grouping drifted between Dart SDK versions — the frb-codegen-check
        # diff gate must compare against the same formatter.
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'flutter/rust -> target'
          shared-key: linux

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libevdev-dev libudev-dev libxi-dev libxtst-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" flutter/pubspec.yaml

      - name: Build evdev helper (release)
        working-directory: rust/evdev-helper
        run: cargo build --release --locked

      - name: Install fastforge
        run: dart pub global activate fastforge 0.6.12

      # The appimage maker invokes `appimagetool` from PATH (no auto-download).
      # GitHub runners have no FUSE, so extract the AppImage and use the inner
      # binary directly. appimagetool shells out to `mksquashfs` which it locates
      # at <bindir>/../lib/appimagekit/mksquashfs — so the whole extracted
      # usr/ tree must land under /usr/local/, not just the appimagetool binary
      # (copying only the binary leaves mksquashfs unfound and the maker fails).
      - name: Install appimagetool
        run: |
          cd /tmp
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null
          sudo cp -r squashfs-root/usr/* /usr/local/
          test -x /usr/local/bin/appimagetool && test -x /usr/local/lib/appimagekit/mksquashfs

      # --hook-pre runs after `flutter build` and before the makers, so the
      # privileged helper + polkit policy get packed into the bundle (they land
      # in /opt/cliphist/ of the deb; the deb postinstall moves the policy to
      # /usr/share/polkit-1/actions/). The AppImage ignores them (see
      # linux/packaging/appimage/make_config.yaml).
      - name: Build Linux packages
        working-directory: flutter
        run: |
          dart pub global run fastforge:main package --platform linux --targets deb,appimage \
            --hook-pre 'cp ../rust/evdev-helper/target/release/cliphist-evdev-helper build/linux/x64/release/bundle/ && cp assets/polkit/com.ping.cliphist.policy build/linux/x64/release/bundle/'
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-linux-amd64-deb
          path: flutter/dist/**/*.deb
          retention-days: 5
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-linux-amd64-appimage
          path: flutter/dist/**/*.AppImage
          retention-days: 5

  build-windows:
    needs: frb-codegen-check
    runs-on: windows-latest
    # Temporarily non-blocking: the Cargokit-driven `flutter build windows`
    # step fails with a context-free MSB8066 "exited with code -1" because
    # Cargokit runs cargo via Process.runSync (capturing stdout/stderr) and
    # MSBuild's VS-generator custom-build step redirects that captured output
    # to a build log the runner never surfaces — so the real cargo error is
    # invisible. The "Build Rust library" step below builds the cdylib
    # directly to surface that error in the log; once the root cause is fixed
    # and that step + the fastforge step both go green, remove this
    # continue-on-error. Linux deb/AppImage still ship; Windows lands next.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        # Pinned to the Flutter version used to generate + validate the FRB
        # bindings locally. The codegen runs `dart format` on its output, and
        # import grouping drifted between Dart SDK versions — the frb-codegen-check
        # diff gate must compare against the same formatter.
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'flutter/rust -> target'
          shared-key: windows
      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version: .*/version: $VERSION+${{ github.run_number }}/" flutter/pubspec.yaml
      - name: Install fastforge
        run: dart pub global activate fastforge 0.6.12
      # The exe maker needs Inno Setup 6 (ISCC.exe) — it does not auto-install.
      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
      # Diagnostic: build the Rust cdylib directly so any cargo compile/link
      # error is streamed to this log. Cargokit (invoked by `flutter build
      # windows` below) runs cargo via Process.runSync, which captures
      # stdout/stderr and only re-emits it on failure via a Dart log.severe —
      # but MSBuild's VS-generator custom-build step redirects that to a
      # build log the runner never surfaces, so a Cargokit cargo failure shows
      # only as a context-free MSB8066 "exited with code -1". Building here
      # with the host target (x86_64-pc-windows-msvc, same as Cargokit's
      # windows-x64) reproduces the compile faithfully; cargo writes errors to
      # stderr which Actions captures. If this step is green but the fastforge
      # step still fails, the problem is Cargokit plumbing, not the Rust code.
      - name: Build Rust library (surfaces cargo errors Cargokit hides)
        working-directory: flutter/rust
        run: cargo build --release
      - name: Build Windows packages
        working-directory: flutter
        run: |
          dart pub global run fastforge:main package --platform windows --targets exe,msix
      - name: Upload NSIS setup
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-windows-x64-setup
          path: flutter/dist/**/*.exe
          retention-days: 5
      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-windows-x64-msix
          path: flutter/dist/**/*.msix
          retention-days: 5

  build-macos:
    needs: frb-codegen-check
    runs-on: macos-latest
    # Non-blocking until the Cargokit macOS linkage issue is fixed: the Rust
    # staticlib builds both arm64+x86_64 slices, but `global_hotkey`'s macOS
    # manager symbols come out undefined in the fat archive (ld: symbol(s) not
    # found, both archs) — reproducible only on a real macOS host. Linux + Win
    # still ship; the dmg is added back when this lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        # Pinned to the Flutter version used to generate + validate the FRB
        # bindings locally. The codegen runs `dart format` on its output, and
        # import grouping drifted between Dart SDK versions — the frb-codegen-check
        # diff gate must compare against the same formatter.
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'flutter/rust -> target'
          shared-key: macos
      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' 's/^version: .*/version: '"$VERSION"'+${{ github.run_number }}/' flutter/pubspec.yaml
      - name: Install fastforge
        run: dart pub global activate fastforge 0.6.12
      # The dmg maker requires `appdmg` and auto-installs it via `pnpm`, which
      # is not on the macos runner — pre-install with npm so the requirement
      # check passes.
      - name: Install appdmg
        run: npm install -g appdmg
      # Native arch only (macos-latest = arm64). An x86_64 dmg would need a
      # full x64 cross toolchain (Rust + Flutter) — tracked as a follow-up.
      - name: Build macOS dmg
        working-directory: flutter
        run: |
          dart pub global run fastforge:main package --platform macos --targets dmg
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-macos-arm64
          path: flutter/dist/**/*.dmg
          retention-days: 5

  checksums:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f -not -name '*.sha256' -exec sha256sum {} \; | sort > checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/checksums.sha256
          retention-days: 5

  release:
    needs: [build-linux, build-windows, build-macos, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate release notes
        run: |
          git log --oneline --no-decorate $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD > changelog.txt
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
          body_path: changelog.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}