name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev libayatana-appindicator3-dev libevdev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ubuntu

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/\"version\": \"0.1.0\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \"0.1.0\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"0.1.0\"/\"version\": \"$VERSION\"/" package.json

      - run: npm ci
      - run: npm run tauri build

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-linux-amd64-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 5

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-linux-amd64-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 5

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: windows

      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/\"version\": \"0.1.0\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \"0.1.0\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"0.1.0\"/\"version\": \"$VERSION\"/" package.json

      - run: npm ci
      - run: npm run tauri build

      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 5

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-windows-x64-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 5

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            suffix: macos-arm64
          - target: x86_64-apple-darwin
            suffix: macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: macos-${{ matrix.target }}

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' "s/\"version\": \"0.1.0\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i '' "s/^version = \"0.1.0\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i '' "s/\"version\": \"0.1.0\"/\"version\": \"$VERSION\"/" package.json

      - run: npm ci
      - run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-${{ matrix.suffix }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 5

  checksums:
    needs: [ubuntu, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f -not -name '*.sha256' -exec sha256sum {} \; | sort > checksums.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/checksums.sha256
          retention-days: 5

  release:
    needs: [ubuntu, windows, macos, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          git log --oneline --no-decorate $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD > changelog.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
          body_path: changelog.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
