name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Block the build matrix until the generated FRB bindings are in sync.
  frb-codegen-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install flutter_rust_bridge_codegen 2.12.0
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libevdev-dev libudev-dev libxi-dev libxtst-dev
      - name: Regenerate FRB bindings
        working-directory: flutter
        run: flutter_rust_bridge_codegen generate
      - name: Verify generated files are in sync
        run: git diff --exit-code

  build-linux:
    needs: frb-codegen-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'flutter/rust -> target'
          shared-key: linux

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libevdev-dev libudev-dev libxi-dev libxtst-dev librsvg2-dev

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version: .*/version: $VERSION/" flutter/pubspec.yaml
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' flutter/rust/Cargo.toml
          sed -i 's/^version: .*/version: '"$VERSION"'/' flutter/fastforge.yaml

      - name: Build evdev helper (release)
        working-directory: rust/evdev-helper
        run: cargo build --release --locked

      - name: Install fastforge
        run: dart pub global activate fastforge 0.6.12

      - name: Build Linux packages
        working-directory: flutter
        run: |
          ${HOME}/.pub-cache/bin/fastforge build --platform linux --targets deb,appimage
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-linux-amd64-deb
          path: flutter/build/linux/x64/release/bundle/deb/*.deb
          retention-days: 5
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-linux-amd64-appimage
          path: flutter/build/linux/x64/release/bundle/appimage/*.AppImage
          retention-days: 5

  build-windows:
    needs: frb-codegen-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'flutter/rust -> target'
          shared-key: windows
      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version: .*/version: $VERSION/" flutter/pubspec.yaml
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' flutter/rust/Cargo.toml
          sed -i 's/^version: .*/version: '"$VERSION"'/' flutter/fastforge.yaml
      - name: Install fastforge
        run: dart pub global activate fastforge 0.6.12
      - name: Build Windows packages
        working-directory: flutter
        run: |
          ${HOME}/.pub-cache/bin/fastforge build --platform windows --targets exe,msix
      - name: Upload NSIS setup
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-windows-x64-setup
          path: flutter/build/windows/x64/release/bundle/exe/*.exe
          retention-days: 5
      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-windows-x64-msix
          path: flutter/build/windows/x64/release/bundle/msix/*.msix
          retention-days: 5

  build-macos:
    needs: frb-codegen-check
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            suffix: macos-arm64
          - target: x86_64-apple-darwin
            suffix: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'flutter/rust -> target'
          shared-key: macos-${{ matrix.target }}
      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' 's/^version: .*/version: '"$VERSION"'/' flutter/pubspec.yaml
          sed -i '' 's/^version = ".*"/version = "'"$VERSION"'"/' flutter/rust/Cargo.toml
          sed -i '' 's/^version: .*/version: '"$VERSION"'/' flutter/fastforge.yaml
      - name: Install fastforge
        run: dart pub global activate fastforge 0.6.12
      - name: Build macOS dmg
        working-directory: flutter
        run: |
          ${HOME}/.pub-cache/bin/fastforge build --platform macos --targets dmg --build-target ${{ matrix.target }}
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: cliphist-${{ matrix.suffix }}
          path: flutter/build/macos/${{ matrix.target }}/release/bundle/dmg/*.dmg
          retention-days: 5

  checksums:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f -not -name '*.sha256' -exec sha256sum {} \; | sort > checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/checksums.sha256
          retention-days: 5

  release:
    needs: [build-linux, build-windows, build-macos, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate release notes
        run: |
          git log --oneline --no-decorate $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD > changelog.txt
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
          body_path: changelog.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}