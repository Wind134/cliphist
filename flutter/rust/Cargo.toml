[package]
name = "rust_lib_cliphist"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
ammonia = "4"
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3"

[target.'cfg(target_os = "linux")'.dependencies]
url = "2"
wl-clipboard-rs = "0.9.3"
wl-clipboard-watch = "0.1.0"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# `grab` (the global keyboard tap used by the double-tap listener) and
# `simulate` (synthetic key events for paste injection) are behind the
# `unstable_grab` feature. rdev's Linux-only evdev-rs/epoll/inotify deps are
# target-gated inside rdev, so enabling the feature on Windows+macOS is safe.
# macOS also uses rdev for double-tap + Cmd+V paste (requires the user to
# grant the app Accessibility permission; without it `grab` errors out and
# the "双击快捷键" status dot stays grey, matching the Linux auth UX).
rdev = { version = "0.5", features = ["unstable_grab"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
# Cross-platform advisory file lock for the single-instance guard
# (`fs2::FileExt::try_lock_exclusive`). The lock auto-releases when the
# process dies (even on crash), so there is no stale-lock cleanup to do.
fs2 = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4"
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
