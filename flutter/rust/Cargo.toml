[package]
name = "rust_lib_cliphist"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
image = "0.25"
ammonia = "4"
global-hotkey = "0.8"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# `grab` (the keyboard hook used by the double-tap listener) is behind the
# unstable_grab feature; its evdev-rs/epoll/inotify deps are Linux-only and
# target-gated, so enabling it is safe on Windows.
rdev = { version = "0.5", features = ["unstable_grab"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }