[package]
name = "rust_lib_cliphist"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
image = "0.25"
ammonia = "4"
global-hotkey = "0.8"
libc = "0.2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# `grab` (the global keyboard tap used by the double-tap listener) and
# `simulate` (synthetic key events for paste injection) are behind the
# `unstable_grab` feature. rdev's Linux-only evdev-rs/epoll/inotify deps are
# target-gated inside rdev, so enabling the feature on Windows+macOS is safe.
# macOS also uses rdev for double-tap + Cmd+V paste (requires the user to
# grant the app Accessibility permission; without it `grab` errors out and
# the "双击快捷键" status dot stays grey, matching the Linux auth UX).
rdev = { version = "0.5", features = ["unstable_grab"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
# Cross-platform advisory file lock for the single-instance guard
# (`fs2::FileExt::try_lock_exclusive`). The lock auto-releases when the
# process dies (even on crash), so there is no stale-lock cleanup to do.
fs2 = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Cargokit builds the Rust crate as a `staticlib` (crate-type above) and lipo's
# the per-arch slices into a fat archive for the Xcode link. With the default
# `codegen-units = 16`, a large crate like `global-hotkey` (whose macOS backend
# is one big `mod.rs` of objc2/Carbon FFI) gets split across many CGU objects,
# and the staticlib+lipo assembly can drop one — which on macOS manifested as
# `ld: Undefined symbols … GlobalHotKeyManager::new/register/unregister/
# hotkey_handler/Drop` (the missing object also carried the Carbon/
# CoreGraphics `extern` refs, which is why no framework symbols were listed).
# Forcing a single codegen unit keeps the whole crate in one object so no CGU
# can go missing. `lto = false` keeps the staticlib's symbols available for the
# downstream Xcode link (LTO would internalize/remove them).
[profile.release]
codegen-units = 1
lto = false