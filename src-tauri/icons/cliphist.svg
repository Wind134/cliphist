<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F2B45"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner border ring -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Shadow under clipboard -->
  <rect x="104" y="110" width="304" height="332" rx="44" fill="rgba(0,0,0,0.2)"/>

  <!-- Clipboard body -->
  <rect x="98" y="94" width="316" height="348" rx="44" fill="#FFFFFF"/>

  <!-- Clipboard clip arc at top -->
  <path d="M162,102 C162,66 200,46 256,46 C312,46 350,66 350,102"
        fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>

  <!-- Clip inner hole (background shows through) -->
  <rect x="220" y="70" width="72" height="52" rx="14" fill="url(#bg)"/>

  <!-- Clock face circle -->
  <circle cx="256" cy="290" r="88" fill="#F8FAFC"/>
  <circle cx="256" cy="290" r="88" fill="none" stroke="#E2E8F0" stroke-width="6"/>

  <!-- Hour hand (short, pointing ~10 o'clock) -->
  <path d="M256,290 L224,248" stroke="#1E293B" stroke-width="20" stroke-linecap="round"/>

  <!-- Minute hand (long, pointing ~2 o'clock) -->
  <path d="M256,290 L314,242" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="290" r="12" fill="#1E293B"/>

  <!-- Subtle highlight on clip -->
  <path d="M170,98 C170,76 198,56 256,56 C314,56 342,76 342,98"
        fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round"/>

</svg>
